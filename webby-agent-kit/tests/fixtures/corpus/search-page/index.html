<!doctype html>
<html>
  <head><title>Atlas Search</title><link rel="stylesheet" href="style.css"></head>
  <body>
    <main>
      <h1>Atlas Search</h1>
      <form action="results.html" method="get">
        <label for="query">Search pages</label>
        <input id="query" type="search" name="q" placeholder="Search docs">
        <button type="submit">Search</button>
      </form>
      <p>Try a short query to explore the local index.</p>
    </main>
  </body>
</html>
