<!doctype html>
<html>
  <head>
    <title>Fixture Gallery</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="gallery">
      <h1>Fixture Gallery</h1>
      <p>Decoded images, HTML sizing, CSS sizing, and fallback placeholders.</p>
      <img id="png-image" src="red-green.png" alt="PNG color strip">
      <img id="jpeg-image" src="blue.jpg" alt="JPEG blue tile" width="12" height="12">
      <img id="css-sized-image" class="thumbnail" src="red-green.png" alt="CSS sized thumbnail" width="40" height="8">
      <img id="missing-image" src="missing.png" alt="Missing image fallback" width="18" height="12">
    </main>
  </body>
</html>
